<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f172a" />
    <title>Kashif - كاشف</title>

    <!-- Set the theme class BEFORE React renders.
         Runs synchronously so the page never paints in the wrong mode
         (no flash-of-light-mode on a dark-mode reload).
         Priority: explicit localStorage choice > OS preference > light. -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (saved === null && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) { /* localStorage blocked — ignore */ }
      })();
    </script>

    <!-- Inter: neutral body text + great for tabular numbers.
         Space Grotesk: display face for page titles, hero headlines, tickers.
         Tajawal: Arabic body. Browsers auto-pick it per-character when
         the Latin font (Inter) doesn't cover Arabic glyphs. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
